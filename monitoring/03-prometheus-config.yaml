apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
      evaluation_interval: 10s

    scrape_configs:
      # AMF's PDU session / GMM-state / CM-state / SBI / NAS / NGAP metrics.
      # Discovered via the prometheus.io/scrape pod annotations set in
      # charts/.../free5gc-amf/templates/amf-deployment.yaml, so this job
      # would pick up any other NF that gets the same annotations later
      # (today only AMF has a /metrics endpoint at all).
      - job_name: "free5gc-nf-metrics"
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ["core"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_nf]
            target_label: nf
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node

      # Kubernetes object state (pod Ready/NotReady, restarts, node
      # conditions, deployment replica counts) via kube-state-metrics.
      - job_name: "kube-state-metrics"
        static_configs:
          - targets: ["kube-state-metrics.monitoring.svc:8080"]

      # Per-node health: cluster node list itself (kubelet's own /metrics,
      # mostly Go runtime + a handful of node-level stats).
      - job_name: "kubernetes-nodes"
        scheme: https
        tls_config:
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node

      # Per-node/per-container CPU & memory (cAdvisor, exposed through the
      # same kubelet). This is what "health of nodes" resource panels use.
      - job_name: "kubernetes-nodes-cadvisor"
        scheme: https
        tls_config:
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
