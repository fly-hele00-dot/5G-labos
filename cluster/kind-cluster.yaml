kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: corelab
# Private-only addressing (not the kind/upstream defaults) and a loopback-only
# API server: nothing in this cluster is published on a host interface.
# Node IPs come from the dedicated `corelab-net` docker network that
# scripts/02-create-kind-cluster.sh creates (172.29.40.0/24).
networking:
  apiServerAddress: "127.0.0.1"
  podSubnet: "10.212.0.0/16"
  serviceSubnet: "10.213.0.0/16"
nodes:
- role: control-plane
- role: worker
